[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-vala"
description = "Vala grammar for tree-sitter"
version = "0.53.1"
keywords = ["incremental", "parsing", "tree-sitter", "vala"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Princeton Ferro" }]
requires-python = ">=3.10"
license.text = "LGPL-2.1-only"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/vala-lang/tree-sitter-vala"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"

[package]
name = "tree-sitter-vala"
description = "Vala grammar for tree-sitter"
version = "0.53.1"
authors = [""]
license = "LGPL-2.1-only"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "vala"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/vala-lang/tree-sitter-vala"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/COPYING",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
